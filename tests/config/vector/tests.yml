componentType: vector
# `operations` declares the optional capabilities a component supports. A
# capability that is not listed must be reported as UNIMPLEMENTED (or
# INVALID_ARGUMENT where the contract says so) rather than silently ignored:
#   queued-ack           native durable queued acknowledgement for every
#                        write, including Delete
#   score-threshold      inclusive score_threshold
#   filter               portable filters over structured record metadata
#                        (typed: string, number and bool operands, $in/$nin,
#                        $exists and the $and/$or/$not logical operators)
#   query-by-id          by_id queries
#   metric-cosine        DISTANCE_METRIC_COSINE
#   metric-dot-product   DISTANCE_METRIC_DOT_PRODUCT
#   metric-euclidean     DISTANCE_METRIC_EUCLIDEAN
# Metrics that are not listed must be rejected with INVALID_ARGUMENT both on
# CreateCollection and on Query. The alpha contract is dense-vector only.
components:
  - component: meilisearch
    operations:
      - queued-ack
      - score-threshold
      - filter
      - query-by-id
      # Meilisearch only supports cosine similarity.
      - metric-cosine
    config:
      # Component-specific collection settings are passed through verbatim.
      # Record metadata is stored under the reserved `daprMetadata` attribute,
      # which must be filterable for the portable filter DSL to apply to it.
      createCollectionMetadata:
        filterableAttributes: "daprMetadata"
      # Dimensions is passed as the typed CreateCollectionRequest.Dimensions
      # and drives the generated test vectors; the collection is created with
      # DISTANCE_METRIC_UNSPECIFIED so the component's default metric applies.
      dimensions: 4
      waitTimeout: 20s
