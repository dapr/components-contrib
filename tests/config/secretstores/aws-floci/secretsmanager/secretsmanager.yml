apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: aws-secretsmanager
spec:
  type: secretstores.aws.secretmanager
  version: v1
  metadata:
    - name: endpoint
      value: ${{FLOCI_ENDPOINT}}
    - name: accessKey
      value: "test"
    - name: secretKey
      value: "test"
    - name: region
      value: "us-east-1"
