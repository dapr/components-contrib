# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: conversation
name: echo
version: v1
status: alpha
title: "Echo"
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-conversation/echo/
metadata:
  - name: maxTokens
    required: false
    description: |
      Default maximum number of "tokens" (whitespace-delimited words) echoed back
      per request. A request-level maxTokens value greater than zero overrides
      this default. When the cap truncates the output, the finish reason is length.
      When unset, the input is echoed back in full without truncation.
    type: number
    example: "2048"
    default: ''
