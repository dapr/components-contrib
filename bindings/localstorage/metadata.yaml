# yaml-language-server: $schema=../../component-metadata-schema.json
schemaVersion: v1
type: bindings
name: localstorage
version: v1
status: stable
title: "Local Storage"
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-bindings/localstorage/
binding:
  output: true
  input: false
  operations:
    - name: create
      description: "Write a file to local storage. Set fileName in invocation metadata to choose its name; otherwise a random UUID is generated."
    - name: get
      description: "Read the file specified by fileName in invocation metadata."
    - name: list
      description: "Recursively list files under rootPath. Set fileName in invocation metadata to list a subdirectory."
    - name: delete
      description: "Delete the file specified by fileName in invocation metadata."
metadata:
  - name: rootPath
    required: true
    description: "The root directory path"
    example: "/tmp/dapr"
