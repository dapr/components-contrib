# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: conversation
name: anthropic
version: v1
status: alpha
title: "Anthropic"
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-conversation/anthropic/
authenticationProfiles:
  - title: "API Key"
    description: "Authenticate using an API key"
    metadata:
      - name: key
        type: string
        required: true
        sensitive: true
        description: |
          API key for Anthropic, or for the Microsoft Foundry resource when apiType is 'foundry'.
        example:  "**********"
        default: ""
  - title: "Workload identity federation (SPIFFE)"
    description: |
      Authenticate without an API key. The Dapr runtime mints a JWT SVID for the app's SPIFFE ID,
      which is exchanged for a short-lived Anthropic access token. Requires mTLS and Sentry JWT
      issuing, with Sentry registered as a federation issuer in the Claude Console.
      Not supported when apiType is 'foundry'.
    metadata:
      - name: federationRuleId
        type: string
        required: true
        description: |
          ID of the Anthropic federation rule that maps the app's SPIFFE ID to a service account.
        example: '"fdrl_01abc"'
      - name: organizationId
        type: string
        required: true
        description: |
          UUID of the Anthropic organization.
        example: '"00000000-0000-0000-0000-000000000000"'
      - name: serviceAccountId
        type: string
        required: true
        description: |
          ID of the Anthropic service account the access token acts as.
        example: '"svac_01abc"'
      - name: workspaceId
        type: string
        required: false
        description: |
          ID of the workspace to scope the access token to. Required when the federation rule is
          enabled for more than one workspace.
        example: '"wrkspc_01abc"'
      - name: audience
        type: string
        required: false
        description: |
          Audience of the JWT SVID. Must match the audience of the federation rule.
        example: '"https://api.anthropic.com"'
        default: '"https://api.anthropic.com"'
metadata:
  - name: model
    required: false
    description: |
      The Anthropic LLM to use. When apiType is 'foundry', this is the Foundry deployment name
      (defaults to the Claude model ID, e.g. 'claude-sonnet-4-6'). Configurable via ANTHROPIC_MODEL
      environment variable.
    type: string
    example: 'claude-sonnet-4-6'
    default: 'claude-sonnet-4-6'
  - name: endpoint
    required: false
    description: |
      Custom base URL for the Anthropic API. Required when apiType is 'foundry'; for Foundry use
      the form 'https://{resource}.services.ai.azure.com/anthropic/v1'. If not specified for the
      default apiType, the public Anthropic API is used.
    type: string
    example: 'https://my-resource.services.ai.azure.com/anthropic/v1'
  - name: apiType
    required: false
    description: |
      The type of API to use. Set to 'foundry' to call Anthropic Claude models hosted on
      Microsoft Foundry; otherwise the public Anthropic API is used.
    type: string
    allowedValues:
      - "anthropic"
      - "foundry"
    example: 'foundry'
    default: 'anthropic'
  - name: cacheTTL
    required: false
    description: |
      A time-to-live value for a prompt cache to expire. Uses Golang durations
    type: string
    example: '10m'
  - name: maxTokens
    required: false
    description: |
      Default maximum number of tokens the model may generate per request.
      A request-level maxTokens value greater than zero overrides this default.
      When unset, no cap is sent and the provider's own default applies.
    type: number
    example: "2048"
    default: ''
