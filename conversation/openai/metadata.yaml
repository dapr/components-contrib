# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: conversation
name: openai
version: v1
status: alpha
title: "OpenAI"
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-conversation/openai/
authenticationProfiles:
  - title: "API Key"
    description: "Authenticate using an API key"
    metadata:
      - name: key
        type: string
        required: true
        sensitive: true
        description: |
          API key for OpenAI.
        example:  "**********"
        default: ""
  - title: "Workload identity federation (SPIFFE)"
    description: |
      Authenticate to OpenAI without an API key. The Dapr runtime mints a JWT SVID for the app's
      SPIFFE ID, which is exchanged for a short-lived OpenAI access token. Requires mTLS and Sentry
      JWT issuing, with Sentry registered as an OpenAI workload identity provider.
      Not supported when apiType is 'azure'.
    metadata:
      - name: identityProviderId
        type: string
        required: true
        description: |
          ID of the OpenAI workload identity provider registered for Sentry.
        example: '"idp_01abc"'
      - name: serviceAccountId
        type: string
        required: true
        description: |
          ID of the OpenAI service account the access token acts as.
        example: '"svc_acct_01abc"'
      - name: audience
        type: string
        required: false
        description: |
          Audience of the JWT SVID. Must match the audience of the workload identity provider.
        example: '"https://api.openai.com/v1"'
        default: '"https://api.openai.com/v1"'
  - title: "Azure OpenAI: Microsoft Entra ID"
    description: |
      Authenticate to Azure OpenAI with Microsoft Entra ID when apiType is 'azure' and key is not
      set. Supports the standard Azure authentication methods, including SPIFFE workload identity,
      where the Dapr runtime's JWT SVID is used as a federated credential.
    metadata:
      - name: azureTenantId
        type: string
        required: false
        description: |
          ID of the Microsoft Entra ID tenant.
        example: '"00000000-0000-0000-0000-000000000000"'
      - name: azureClientId
        type: string
        required: false
        description: |
          Client ID of the Microsoft Entra ID application or managed identity.
        example: '"00000000-0000-0000-0000-000000000000"'
      - name: azureAuthMethods
        type: string
        required: false
        description: |
          Comma-separated list of the Azure authentication methods to try, in order. Use 'spiffe'
          to only use the Dapr SPIFFE identity.
        example: '"spiffe"'
metadata:
  - name: model
    required: false
    description: |
      The OpenAI LLM to use. Configurable via OPENAI_MODEL environment variable.
    type: string
    default: 'gpt-5-nano'
    example: 'gpt-5-nano'
  - name: endpoint
    required: false
    description: |
      Custom API endpoint URL for OpenAI API-compatible services. If not specified, the default OpenAI API endpoint will be used.
    type: string
    example: 'https://api.openai.com/v1'
  - name: cacheTTL
    required: false
    description: |
      A time-to-live value for a prompt cache to expire. Uses Golang durations
    type: string
    example: '10m'
  - name: apiVersion
    required: false
    description: |
      The API version to use for the Azure OpenAI service. This is required when using Azure OpenAI.
    type: string
    example: '2025-01-01-preview'
    default: ''
  - name: apiType
    required: false
    description: |
      The type of API to use for the OpenAI service. This is required when using Azure OpenAI.
    type: string
    allowedValues:
      - "open_ai"
      - "azure"
    example: 'azure'
    default: 'open_ai'
  - name: maxTokens
    required: false
    description: |
      Default maximum number of tokens the model may generate per request.
      A request-level maxTokens value greater than zero overrides this default.
      When unset, no cap is sent and the provider's own default applies.
    type: number
    example: "2048"
    default: ''
  - name: useLegacyMaxTokensField
    required: false
    description: |
      Send the token cap as max_tokens instead of max_completion_tokens.
      Set this when endpoint points at an OpenAI-compatible service that does
      not recognise max_completion_tokens, otherwise the cap is ignored.
    type: bool
    example: "true"
    default: 'false'
  - name: useResponsesAPI
    required: false
    description: |
      Send requests to OpenAI's Responses API (/v1/responses) instead of the
      Chat Completions API. Set this to use function tools with reasoning models
      that reject tools on Chat Completions. Not supported when apiType is azure.
    type: bool
    example: "true"
    default: 'false'
