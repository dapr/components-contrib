# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: conversation
name: ollama
version: v1
status: alpha
title: "Ollama"
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-conversation/ollama/
metadata:
  - name: model
    required: false
    description: |
      The Ollama LLM to use. Configurable via OLLAMA_MODEL environment variable.
    type: string
    example: 'llama3.2:latest'
    default: 'llama3.2:latest'
  - name: cacheTTL
    required: false
    description: |
      A time-to-live value for a prompt cache to expire. Uses Golang durations
    type: string
    example: '10m'
  - name: endpoint
    required: false
    description: |
      The URL of the Ollama server.
    type: string
    example: 'http://10.20.23.21:11434/v1'
    default: 'http://localhost:11434/v1'
  - name: maxTokens
    required: false
    description: |
      Default maximum number of tokens the model may generate per request.
      A request-level maxTokens value greater than zero overrides this default.
      When unset, no cap is sent and the provider's own default applies.
    type: number
    example: "2048"
    default: ''
  - name: headers
    required: false
    sensitive: true
    description: |
      HTTP headers to send on every request to the model endpoint, as a JSON
      object of header names to string values. Use it for headers that a
      gateway or proxy in front of the provider requires, for example a tenant
      ID or a gateway key. A header in this field replaces the header of the
      same name that the component sets. Host, Content-Length and hop-by-hop
      headers are not allowed. When this field is set, the component does not
      follow redirects to a different origin.
    type: string
    example: '{"X-Tenant-ID": "tenant-a", "X-Gateway-Key": "**********"}'
