apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: openrouter
spec:
  type: conversation.openrouter
  version: v1
  metadata:
    - name: key
      value: "${{OPENROUTER_API_KEY}}"
    - name: model
      value: ""   # use default for provider or customize via environment variable as defined in conversation/models.go
    - name: requireParameters
      value: "true"   # only route to providers that support tools and response formats used by the tests
