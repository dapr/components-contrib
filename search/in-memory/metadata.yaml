# yaml-language-server: $schema=../../component-metadata-schema.json
schemaVersion: v1
type: search
name: in-memory
version: v1
status: alpha
title: "In-memory"
description: |
  Keeps every index in the memory of the Dapr sidecar. Data is lost when the
  sidecar stops. Meant for development and tests.
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-search/in-memory/
capabilities:
  # Every query term must occur in a searchable string field. The score counts
  # the occurrences, and hits are ordered by score, then by document id. The
  # default page size is 10.
  - fullTextSearch
  - filtering
  - sorting
  - pagination
  - queuedAck
  - waitForCompletion
metadata:
  - name: indexingDelay
    required: false
    description: |
      Queues every write and applies it once this delay has passed, so that
      queued acknowledgements and wait timeouts can be observed. By default
      writes are applied before the call returns.
    default: '"0s"'
    example: '"2s"'
    type: duration
