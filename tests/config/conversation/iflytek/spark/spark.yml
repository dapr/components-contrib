apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: spark
spec:
  type: conversation.iflytek.spark
  version: v1
  metadata:
    - name: key
      value: "${{IFLYTEK_API_KEY}}"
    - name: model
      value: "spark-x2.5"
    # The CI key is a Token Plan key, which the pay-as-you-go default endpoint rejects.
    - name: endpoint
      value: "https://maas-token-api.cn-huabei-1.xf-yun.com/v2"
    # Thinking is off by default only on the default endpoint.
    - name: thinking
      value: "disabled"
