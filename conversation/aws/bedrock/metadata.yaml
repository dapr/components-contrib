# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: conversation
name: aws.bedrock
version: v1
status: alpha
title: "Amazon Bedrock"
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-conversation/aws-bedrock/
builtinAuthenticationProfiles:
  - name: "aws"
authenticationProfiles:
  - title: "AWS: Web identity federation (SPIFFE)"
    description: |
      Assume an IAM role with AssumeRoleWithWebIdentity, using a JWT SVID minted by the Dapr runtime
      for the app's SPIFFE ID. Requires mTLS and Sentry JWT issuing, with Sentry registered as an IAM
      OIDC identity provider that the role trusts.
    metadata:
      - name: assumeRoleArn
        type: string
        required: true
        description: |
          ARN of the IAM role to assume.
        example: '"arn:aws:iam::123456789012:role/dapr-bedrock"'
      - name: webIdentityAudience
        type: string
        required: true
        description: |
          Audience of the JWT SVID. Must be a client ID (audience) of the IAM OIDC identity provider.
        example: '"sts.amazonaws.com"'
      - name: assumeRoleSessionName
        type: string
        required: false
        description: |
          The session name for the assumed role.
        example: '"dapr-bedrock"'
metadata:
  - name: endpoint
    required: false
    description: |
      AWS endpoint for the component to use, to connect to emulators.
      Do not use this when running against production AWS.
    example: '"http://localhost:4566"'
    type: string
  - name: model
    required: false
    description: |
      The model identifier or inference profile ARN to use. Defaults to Bedrock's default provider model from Amazon.
      You can specify either:
      - A model ID (e.g., "amazon.titan-text-express-v1") that supports on-demand throughput
      - An inference profile ARN for models that require it (found in the AWS Bedrock console under "Cross-Region Inference")
    type: string
    example: 'amazon.titan-text-express-v1'
  - name: responseCacheTTL
    required: false
    description: |
      A time-to-live value for a prompt/response cache to expire. Uses Go duration strings (e.g. "5m", "1h").
      The component also supports the legacy key `cacheTTL` via mapstructure aliases.
    type: string
    example: '10m'
  - name: maxTokens
    required: false
    description: |
      Default maximum number of tokens the model may generate per request.
      A request-level maxTokens value greater than zero overrides this default.
      When unset, no cap is sent and the provider's own default applies.
    type: number
    example: "2048"
    default: ''
