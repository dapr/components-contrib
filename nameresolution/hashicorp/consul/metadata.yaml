# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: nameresolution
name: hashicorp.consul
version: v1
status: alpha
title: "HashiCorp Consul"
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-name-resolution/setup-nr-consul/
metadata:
  - name: client.address
    type: string
    required: false
    description: The address of the Consul agent. If `client` is not set, the Consul SDK defaults apply.
    example: "localhost:8500"
    default: "127.0.0.1:8500"
  - name: client.scheme
    type: string
    required: false
    description: The scheme to use for connecting to Consul (http or https).
    example: "https"
    default: "http"
  - name: client.datacenter
    type: string
    required: false
    description: The Consul datacenter to use.
    example: "dc1"
  - name: client.token
    type: string
    required: false
    description: The Consul ACL token for authentication.
    sensitive: true
    example: "consul-token"
  - name: client.tokenFile
    type: string
    required: false
    description: Path to a file containing the Consul ACL token.
    example: "/path/to/token"
  - name: client.httpAuth.username
    type: string
    required: false
    description: Username for HTTP basic authentication.
    example: "username"
  - name: client.httpAuth.password
    type: string
    required: false
    description: Password for HTTP basic authentication.
    sensitive: true
    example: "password"
  - name: client.tlsConfig.address
    type: string
    required: false
    description: The TLS address of the Consul agent, used as the server name for TLS verification.
    example: "localhost:8501"
  - name: client.tlsConfig.caFile
    type: string
    required: false
    description: Path to the CA certificate file.
    example: "/path/to/ca.crt"
  - name: client.tlsConfig.caPath
    type: string
    required: false
    description: Path to a directory of CA certificates.
    example: "/path/to/certs"
  - name: client.tlsConfig.certFile
    type: string
    required: false
    description: Path to the client certificate file.
    example: "/path/to/client.crt"
  - name: client.tlsConfig.keyFile
    type: string
    required: false
    description: Path to the client private key file.
    example: "/path/to/client.key"
  - name: client.tlsConfig.insecureSkipVerify
    type: bool
    required: false
    description: Skip TLS certificate verification.
    example: "false"
    default: "false"
  - name: queryOptions.datacenter
    type: string
    required: false
    description: The Consul datacenter to use for queries.
    example: "dc1"
  - name: queryOptions.token
    type: string
    required: false
    description: The Consul ACL token to use for queries.
    sensitive: true
    example: "query-token"
  - name: queryOptions.allowStale
    type: bool
    required: false
    description: Whether to allow stale results in queries.
    example: "true"
    default: "false"
  - name: queryOptions.requireConsistent
    type: bool
    required: false
    description: Whether to require consistent reads in queries.
    example: "true"
    default: "false"
  - name: queryOptions.useCache
    type: bool
    required: false
    description: Whether queries use the Consul agent cache. Defaults to `true` only when `queryOptions` is not set at all.
    example: "true"
    default: "false"
  - name: daprPortMetaKey
    type: string
    required: false
    description: The service metadata key that holds the Dapr sidecar port.
    example: "DAPR_PORT"
    default: "DAPR_PORT"
  - name: selfRegister
    type: bool
    required: false
    description: Whether to register this service with Consul.
    example: "true"
    default: "false"
  - name: selfDeregister
    type: bool
    required: false
    description: Whether to deregister this service from Consul on shutdown.
    example: "true"
    default: "false"
  - name: useCache
    type: bool
    required: false
    description: Whether to cache resolved services in memory, kept current with Consul blocking queries.
    example: "true"
    default: "false"
  - name: tags
    type: string
    required: false
    description: A list of tags to add when registering the service.
    example: '["dapr", "v1"]'
  - name: meta
    type: string
    required: false
    description: A map of additional metadata to add when registering the service.
    example: '{"env": "dev"}'
  - name: checks
    type: string
    required: false
    description: A list of health checks to add when registering the service. If not set, a single check on the Dapr sidecar health endpoint is added.
  - name: advancedRegistration
    type: string
    required: false
    description: A full Consul service registration. If set, `checks`, `tags`, `meta` and `selfRegister` are ignored.
