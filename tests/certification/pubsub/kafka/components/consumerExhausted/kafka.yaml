apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: messagebus
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: localhost:19092,localhost:29092,localhost:39092
  - name: consumerGroup
    value: kafkaCertificationExhausted
  - name: authType
    value: "none"
  - name: initialOffset
    value: oldest
  # The component's own retry loop is disabled so the inbound resiliency
  # policy below is the only thing retrying. This mirrors the configuration
  # in dapr/components-contrib#4362.
  - name: consumeRetryEnabled
    value: "false"
  - name: clientConnectionTopicMetadataRefreshInterval
    value: 15s
