apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  initTimeout: 1m
  metadata:
  - name: redisHost
    value: localhost:6379
  - name: useEntraID
    value: "true"
  # Resolves to the fake App Service managed identity endpoint set up by the test
  # through IDENTITY_ENDPOINT and IDENTITY_HEADER.
  - name: azureAuthMethods
    value: "ManagedIdentity"
