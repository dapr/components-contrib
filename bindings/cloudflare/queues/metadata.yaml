# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: bindings
name: cloudflare.queues
version: v1
status: alpha
title: "Cloudflare Queues"
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-bindings/cloudflare-queues/
binding:
  output: true
  input: true
  operations:
    - name: create
      description: "Send message to Cloudflare Queue"
    - name: publish
      description: "Send message to Cloudflare Queue"
authenticationProfiles:
  - title: "API Token Authentication"
    description: |
      Authenticate using Cloudflare API token and account ID. Dapr will create/manage the worker.
    metadata:
      - name: cfAPIToken
        required: true
        sensitive: true
        description: "The Cloudflare API token"
        example: "api-token"
      - name: cfAccountID
        required: true
        description: "The Cloudflare account ID"
        example: "account-id"
      - name: key
        required: true
        sensitive: true
        description: "The Ed25519 private key in PKCS#8 PEM format for JWT signing"
        example: "-----BEGIN PRIVATE KEY-----\nXXX..."
      - name: workerName
        required: true
        description: "The worker name for JWT token audience"
        example: "worker"
  - title: "Connect to Pre-deployed Worker"
    description: |
      Connect to a worker that has been pre-deployed and is ready to use. No API tokens needed.
    metadata:
      - name: workerUrl
        required: true
        description: "The Cloudflare worker URL"
        example: "https://your-worker.your-subdomain.workers.dev"
      - name: key
        required: true
        sensitive: true
        description: "The Ed25519 private key in PKCS#8 PEM format for JWT signing"
        example: "-----BEGIN PRIVATE KEY-----\nXXX..."
      - name: workerName
        required: true
        description: "The worker name for JWT token audience"
        example: "my-worker"
metadata:
  - name: queueName
    required: true
    description: "The Cloudflare queue name"
    example: "my-queue"
  - name: timeoutInSeconds
    required: false
    description: "Timeout for network requests in seconds"
    example: '20'
    default: '20'
  - name: queueID
    required: false
    binding:
      input: true
    description: |
      The ID of the Cloudflare queue to receive messages from.
      When empty, the ID is looked up by name in the account, which requires the API token to have the "queues#read" permission.
    example: '"8ceb4b1b5b6f4f8fa54b8b0dd7c4a6d9"'
  - name: batchSize
    required: false
    type: number
    binding:
      input: true
    description: |
      Maximum number of messages to receive with each pull, between 1 and 100.
    example: '10'
    default: '5'
  - name: visibilityTimeout
    required: false
    type: duration
    binding:
      input: true
    description: |
      How long the pulled messages stay invisible to other consumers, between 1s and 12h.
      It must be longer than the time the application needs to process a full batch, otherwise the messages are delivered again.
    example: '"1m"'
    default: '"30s"'
  - name: pollingInterval
    required: false
    type: duration
    binding:
      input: true
    description: |
      How long to wait before pulling again after the queue came back empty.
    example: '"5s"'
    default: '"10s"'
