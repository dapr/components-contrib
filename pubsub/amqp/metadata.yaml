# yaml-language-server: $schema=../../component-metadata-schema.json
schemaVersion: v1
type: pubsub
name: amqp
version: v1
status: beta
title: "AMQP 1.0"
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-pubsub/setup-amqp/
capabilities:
  - ttl
description: |
  Publish and subscribe over AMQP 1.0. Verified against Apache ActiveMQ Artemis and Solace PubSub+.
  Note that this is AMQP 1.0, which is a different protocol from the AMQP 0-9-1 spoken by
  `pubsub.rabbitmq`.
  A subscription can set these keys in its own metadata: `subscriptionName` (link name, so the
  broker subscription has a known name), `durable` (the subscription and its messages stay while
  no consumer is attached), `shared` (replicas that use one subscription name share its messages),
  `selector` (a JMS selector the broker applies to the subscription) and `allowSelectorChange`
  (let the broker recreate a durable subscription whose selector changed). To change the selector
  of a durable subscription, use a new `subscriptionName`: the broker drops the messages it holds
  when the selector changes, and reports nothing while no consumer is attached. While consumers
  are attached, for example during a rolling update, the broker refuses the changed selector, and
  the subscription ends with an error log instead of retrying until the broker recreates it, unless
  `allowSelectorChange` is set. The sidecar stays up, and once the rolling update completes no
  replica consumes the subscription; a restart with the new selector then drops its messages. Go
  back to the old selector to resume, or use a new `subscriptionName`.
authenticationProfiles:
  - title: "Username and password"
    description: "Authenticate with broker credentials"
    metadata:
      - name: username
        required: true
        sensitive: false
        description: "The username to connect to the broker"
        example: '"default"'
        type: string
      - name: password
        required: true
        sensitive: true
        description: "The password to connect to the broker"
        example: '"default"'  
        type: string
  - title: "No authentication"
    description: "Connect to the broker without credential validation"
    metadata:
      - name: anonymous
        required: true
        description: |
          Connect to the broker without credential validation; only works if enabled on the broker.
        example: '"true"'
        type: bool
metadata:
  - name: url
    required: true
    description: |
      Address of the AMQP broker.
      Use the `amqp://`` URI scheme for non-TLS communication, and the `amqps://` URI scheme for TLS communication.
    example: '"amqp://host.domain[:port]"'
    sensitive: true
    type: string   
  - name: caCert
    required: false
    description: |
      Certificate Authority (CA) certificate in PEM format for verifying server TLS certificates.
    example: '"-----BEGIN CERTIFICATE-----\n<base64-encoded DER>\n-----END CERTIFICATE-----"'
    type: string
  - name: clientCert
    required: false
    description: |
      TLS client certificate in PEM format, for using TLS.
    example: '"-----BEGIN CERTIFICATE-----\n<base64-encoded DER>\n-----END CERTIFICATE-----"'
    type: string
  - name: clientKey
    required: false
    sensitive: true
    description: |
      TLS client key in PEM format, for using TLS.
    example: '"-----BEGIN PRIVATE KEY-----\n<base64-encoded PKCS8>\n-----END RSA PRIVATE KEY-----"'
    type: string
  - name: topicAddressPrefix
    required: false
    description: |
      Prefix prepended to the AMQP address of a topic, which is used for a bare topic name and for
      topics named `topic:<name>`.
      Defaults to no prefix, which addresses the topic by name. Set it to the multicast prefix the
      broker is configured with, for example the `multicastPrefix` of an Apache ActiveMQ Artemis
      acceptor. Solace brokers use `topic://`.
    default: '""'
    example: '"multicast://"'
    type: string
  - name: queueAddressPrefix
    required: false
    description: |
      Prefix prepended to the AMQP address of a queue, which is used for topics named `queue:<name>`.
      Defaults to no prefix, which addresses the queue by name. Set it to the anycast prefix the
      broker is configured with, for example the `anycastPrefix` of an Apache ActiveMQ Artemis
      acceptor. Solace brokers use `queue://`.
      If both prefixes are empty, `queue:<name>` addresses the same destination as `<name>`, so
      configure both on a broker that distinguishes queue and topic semantics.
    default: '""'
    example: '"anycast://"'
    type: string
  - name: containerID
    required: false
    description: |
      AMQP container ID of the connections that carry named subscriptions, which are subscriptions
      that set `subscriptionName`. A broker such as Apache ActiveMQ Artemis names the subscription
      queue `<containerID>.<subscriptionName>`, so every replica of the app must use the same value,
      and it must not change between restarts. Defaults to the consumer ID that Dapr gives every
      pub/sub component: the app ID, or the `consumerID` metadata if the component sets it.
    example: '"orders-service"'
    type: string
  - name: durableMessages
    required: false
    description: |
      Mark every published message as durable, so that the broker keeps it across a broker
      restart. AMQP 1.0 messages are not durable unless the publisher says so. Set it when you use
      durable subscriptions.
    default: '"false"'
    example: '"true"'
    type: bool
  - name: applicationPropertiesFromMetadata
    required: false
    description: |
      Copy the metadata of each publish request onto the message, so that a broker-side filter,
      for example an Apache ActiveMQ Artemis selector, can match on it. The `subject` key sets the
      AMQP subject, which Artemis selectors read as `JMSType`. Every other key becomes an
      application property with a string value. `ttlInSeconds`, `rawPayload` and `cloudevent.*`
      keys are not copied. To compare a property with a number in an Artemis selector, prefix the
      selector with `convert_string_expressions:`.
    default: '"false"'
    example: '"true"'
    type: bool
  - name: backOffPolicy
    required: false
    description: |
      Retry policy used between attempts to re-open a subscription after the broker connection drops.
      Either `constant` or `exponential`.
    default: '"constant"'
    example: '"constant"'
    type: string
  - name: backOffDuration
    required: false
    description: |
      Delay between attempts to re-open a subscription, when `backOffPolicy` is `constant`.
      The component retries for as long as the subscription exists, so this sets the pace, not a limit.
    default: '"5s"'
    example: '"1s"'
    type: duration
  - name: backOffInitialInterval
    required: false
    description: |
      First delay between attempts to re-open a subscription, when `backOffPolicy` is `exponential`.
    default: '"500ms"'
    example: '"100ms"'
    type: duration
  - name: backOffMaxInterval
    required: false
    description: |
      Longest delay between attempts to re-open a subscription, when `backOffPolicy` is `exponential`.
    default: '"60s"'
    example: '"30s"'
    type: duration
