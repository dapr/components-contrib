# yaml-language-server: $schema=../../component-metadata-schema.json
schemaVersion: v1
type: binarystore
name: in-memory
version: v1
status: stable
title: "In-memory"
description: "In-memory binary store. Data is held only in process memory: it is not persisted to disk and does not survive a process restart, and it is not shared across multiple instances of an application."
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-binarystore/in-memory/
metadata:
  - name: prefix
    required: false
    description: |
      An optional prefix prepended to all file names stored by this component.
    example: '"myprefix"'
  - name: maxSize
    type: number
    required: false
    default: "4194304"
    description: |
      Maximum size in bytes of a single file that can be stored. Uploads larger
      than this are rejected. Must be greater than zero and less than
      9223372036854775807 (math.MaxInt64).
    example: '"8388608"'
  - name: maxTotalSize
    type: number
    required: false
    default: "536870912"
    description: |
      Maximum combined size in bytes of all files held by the store. Uploads
      that would exceed this limit are rejected, bounding the total memory the
      component can use. Must be greater than zero, and maxTotalSize and
      maxSize combined must not exceed 9223372036854775807 (math.MaxInt64).
    example: '"1073741824"'
