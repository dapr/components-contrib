# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: pubsub
name: daprmq.queues
version: v1
status: alpha
title: "DaprMQ Queues"
urls:
  - title: Reference
    url: https://github.com/olitomlinson/dapr-mq
metadata:
  - name: httpEndpoint
    required: true
    description: |
      Base URL of the DaprMQ REST API.
    type: string
    example: '"http://localhost:8002"'
  - name: grpcEndpoint
    required: true
    description: |
      Address of the DaprMQ gRPC API.
    type: string
    example: '"localhost:8102"'
  - name: receiveMode
    description: |
      How messages are received. "stream" holds a gRPC stream open: the server keeps up to
      "maxActiveMessages" delivered, refills as they are settled and renews their locks. "poll"
      polls the queue in batches of "dequeueCount" and renews locks from the component.
    type: string
    default: '"stream"'
    example: '"stream", "poll"'
    allowedValues:
      - "stream"
      - "poll"
  - name: lockTTL
    description: |
      How long a delivered message stays locked to this instance. Locks are renewed until the
      message is settled; if this instance goes away without settling, the message is redelivered
      once its lock runs out.
    type: duration
    default: '"30s"'
    example: '"2m"'
  - name: maxActiveMessages
    description: |
      Stream mode: the most messages delivered to this instance and not yet settled (1-1000). Forced
      to 1 when "allowCompetingConsumers" is false or "concurrencyMode" is "single", to keep order.
    type: number
    default: '100'
    example: '20'
  - name: lockRenewalInterval
    description: |
      Poll mode: how often the locks of messages taken but not yet settled are extended. Must be
      less than "lockTTL"; set to "0s" to disable renewal, in which case "lockTTL" must exceed the
      time a message waits for and spends in its handler.
    type: duration
    default: '"10s"'
    example: '"20s"'
  - name: dequeueCount
    description: |
      Poll mode: the most messages taken from the queue per poll (1-1000).
    type: number
    default: '10'
    example: '100'
  - name: pollInterval
    description: |
      Poll mode: how long to wait before polling again when the queue is empty or locked.
    type: duration
    default: '"1s"'
    example: '"250ms"'
  - name: allowCompetingConsumers
    description: |
      Let each subscriber hold its own locks, so every subscriber to the queue consumes
      concurrently. When false, one subscriber at a time holds locks on the queue, which keeps
      delivery strictly in order.
    type: bool
    default: 'true'
    example: '"true", "false"'
  - name: concurrencyMode
    description: |
      Call the subscriber for one message at a time ("single") or several at once ("parallel").
    type: string
    default: '"parallel"'
    example: '"single", "parallel"'
    allowedValues:
      - "single"
      - "parallel"
  - name: maxConcurrentHandlers
    description: |
      The most messages handled at once when "concurrencyMode" is "parallel"; 0 is unlimited,
      which in stream mode means up to "maxActiveMessages".
    type: number
    default: '0'
    example: '20'
  - name: maxRetriableErrorsPerSec
    description: |
      The most failed messages returned for redelivery per second, so a message that keeps failing
      can't be redelivered in a tight loop; 0 is unlimited.
    type: number
    default: '10'
    example: '5'
