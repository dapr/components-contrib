# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: conversation
name: mistral
version: v1
status: alpha
title: "Mistral"
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-conversation/mistral/
authenticationProfiles:
  - title: "API Key"
    description: "Authenticate using an API key"
    metadata:
      - name: key
        type: string
        required: true
        sensitive: true
        description: |
          API key for Mistral.
        example:  "**********"
        default: ""
metadata:
  - name: model
    required: false
    description: |
      The Mistral LLM to use. Configurable via MISTRAL_MODEL environment variable.
    type: string
    example: 'open-mistral-7b'
    default: 'open-mistral-7b'
  - name: cacheTTL
    required: false
    description: |
      A time-to-live value for a prompt cache to expire. Uses Golang durations
    type: string
    example: '10m'
  - name: maxTokens
    required: false
    description: |
      Default maximum number of tokens the model may generate per request.
      A request-level maxTokens value greater than zero overrides this default.
      When unset, no cap is sent and the provider's own default applies.
    type: number
    example: "2048"
    default: ''
