apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: binarystore-in-memory-prefix
spec:
  type: binarystore.in-memory
  version: v1
  metadata:
  - name: prefix
    value: conf-prefix/nested
  # Raised above the conformance suite's large-payload size
  # (2*DefaultUploadPartSize + 1MiB = 33 MiB) so the streaming test can run.
  - name: maxSize
    value: 48Mi
