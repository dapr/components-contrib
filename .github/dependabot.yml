version: 2
updates:
  # Git
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
  # gomod main pkg
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
    groups:
      # Minor and patch updates arrive as one PR per directory; majors stay separate.
      gomod-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      gomod-security-minor-patch:
        applies-to: security-updates
        update-types: ["minor", "patch"]
