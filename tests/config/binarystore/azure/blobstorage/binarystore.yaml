apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: binarystore-azure
spec:
  type: binarystore.azure.blobstorage
  version: v1
  metadata:
  - name: accountName
    value: ${{AzureBlobStorageAccount}}
  - name: accountKey
    value: ${{AzureBlobStorageAccessKey}}
  - name: containerName
    value: binarystore-conf
