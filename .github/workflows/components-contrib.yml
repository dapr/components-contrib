name: "Build, Lint, Unit Test - Linux AMD64 Only"

on:
  workflow_dispatch:
  push:
    branches:
      - feature/*
  pull_request:
    branches:
      - main
      - feature/*
      - gh-readonly-queue/main/*
  merge_group:

jobs:
  build:
    name: Build linux_amd64 binaries
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
      GOPROXY: https://proxy.golang.org
      GOLANGCI_LINT_VER: "v2.10.1"
    steps:
      - name: Check out code into the Go module directory
        if: ${{ steps.skip_check.outputs.should_skip != 'true' }}
        uses: actions/checkout@v7
      - name: Set up Go
        id: setup-go
        if: ${{ steps.skip_check.outputs.should_skip != 'true' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: 'false'
      - name: Cache Go modules (Linux)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: linux-amd64-go-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            linux-amd64-go-${{ steps.setup-go.outputs.go-version }}-
      - name: Check components-schema
        if: steps.skip_check.outputs.should_skip != 'true'
        run: make check-component-metadata-schema-diff
      - name: Check components metadata yaml up to date
        if: steps.skip_check.outputs.should_skip != 'true'
        run: make check-component-metadata
      - name: Run golangci-lint
        if: steps.skip_check.outputs.should_skip != 'true'
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VER }}
          skip-cache: true
          only-new-issues: true
          args: --timeout 15m
      - name: Run go mod tidy check diff
        if: steps.skip_check.outputs.should_skip != 'true'
        run: make modtidy-all check-mod-diff
#       - name: Run Go Vulnerability Check
#         if: steps.skip_check.outputs.should_skip != 'true'
#         run: |
#           go install golang.org/x/vuln/cmd/govulncheck@latest
#           govulncheck ./...
      - name: Run make test
        env:
          COVERAGE_OPTS: "-coverprofile=coverage.txt -covermode=atomic"
          IPFS_TEST: "1"
        if: steps.skip_check.outputs.should_skip != 'true'
        run: make test
      - name: Start Floci OCI
        id: start-floci-oci
        if: steps.skip_check.outputs.should_skip != 'true'
        run: .github/scripts/components-scripts/docker-compose.sh floci-oci floci-oci up-wait binarystore-oci-objectstorage
      - name: Trust Floci OCI certificate
        if: steps.skip_check.outputs.should_skip != 'true'
        run: |
          echo '127.0.0.1 objectstorage.us-ashburn-1.oraclecloud.com' | sudo tee -a /etc/hosts
          container_id=$(docker compose -f .github/infrastructure/docker-compose-floci-oci.yml -p floci-oci ps -q floci-oci)
          docker exec "$container_id" cat /app/data/tls/floci-selfsigned.crt > floci-oci.crt
          sudo cp floci-oci.crt /usr/local/share/ca-certificates/
          sudo update-ca-certificates
      - name: Run OCI Object Storage binary store integration tests with Floci
        if: steps.skip_check.outputs.should_skip != 'true'
        run: go test -count=1 -tags=integration_test -timeout=5m -coverprofile=coverage-floci-oci.txt -covermode=atomic -run '^TestStoreBehaviourWithFloci$' ./binarystore/oci/objectstorage
      - name: Capture Floci OCI logs
        if: failure() && steps.start-floci-oci.outcome != 'skipped'
        run: .github/scripts/components-scripts/docker-compose.sh floci-oci floci-oci logs binarystore-oci-objectstorage
      - name: Stop Floci OCI
        if: always() && steps.start-floci-oci.outcome != 'skipped'
        run: .github/scripts/components-scripts/docker-compose.sh floci-oci floci-oci down binarystore-oci-objectstorage
      - name: Codecov
        if: matrix.target_arch == 'amd64' && matrix.target_os == 'linux'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.txt,coverage-floci-oci.txt

  check-metadata-bundle-changes:
    name: Detect metadata file changes
    runs-on: ubuntu-latest
    outputs:
      metadata: ${{ steps.filter.outputs.metadata }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            metadata:
              - '**/metadata.yaml'
              - 'component-metadata-schema.json'

  check-metadata-bundle:
    name: Check component metadata bundle
    needs: check-metadata-bundle-changes
    if: needs.check-metadata-bundle-changes.outputs.metadata == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: 'false'
      - name: Check component metadata bundle can be generated
        run: make bundle-component-metadata
