# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: secretstores
name: hashicorp.vault
version: v1
status: stable
title: "Hashicorp Vault"
urls:
  - title: Reference
    url: "https://docs.dapr.io/reference/components-reference/supported-secret-stores/hashicorp-vault/"
metadata:
  - name: vaultAddr
    required: false
    description: |
      The address of the Vault server.
    example: "https://127.0.0.1:8200"
    type: string
    default: "https://127.0.0.1:8200"
  - name: caPem
    required: false
    description: |
      The inlined contents of the CA certificate to use, in PEM format. If defined, takes precedence over "caPath" and "caCert".
    example: |
      "-----BEGIN PUBLIC KEY-----\n...Base64 encoding of the DER encoded certificate...\n-----END PUBLIC KEY-----"
    type: string
  - name: caPath
    required: false
    description: The path to a folder holding the CA certificate file to use, in PEM format. If the folder contains multiple files, only the first file found will be used. If defined, takes precedence over caCert.
    example: "path/to/cacert/holding/folder"
    type: string
  - name: caCert
    required: false
    description: The path to the CA certificate to use, in PEM format.
    example: "path/to/cacert.pem"
    type: string
  - name: skipVerify
    required: false
    description: Skip TLS verification.
    example: "true"
    default: "false"
    type: string
  - name: tlsServerName
    required: false
    description: The name of the server requested during TLS handshake in order to support virtual hosting. This value is also used to verify the TLS certificate presented by Vault server.
    example: "tls-server"
    type: string
  - name: vaultAuthMethod
    required: false
    description: |
      The authentication method to use against Vault. "token" uses a static token or a token mounted to a file (see vaultToken/vaultTokenMountPath). "kubernetes" authenticates natively using the Kubernetes Auth Method and the pod's service account token, without requiring a Vault Agent Injector sidecar, and automatically renews/re-authenticates in the background.
    example: "kubernetes"
    default: "token"
    type: string
    allowedValues:
      - "token"
      - "kubernetes"
  - name: vaultTokenMountPath
    required: false
    description: Path to file containing token. Required when vaultAuthMethod is "token" and vaultToken is not set.
    example: "path/to/file"
    type: string
  - name: vaultToken
    required: false
    description: Token for authentication within Vault. Required when vaultAuthMethod is "token" and vaultTokenMountPath is not set.
    example: "tokenValue"
    type: string
  - name: vaultKubernetesRole
    required: false
    description: |
      The Vault role to authenticate as when vaultAuthMethod is "kubernetes". Required when vaultAuthMethod is "kubernetes".
    example: "my-app-role"
    type: string
  - name: vaultKubernetesMountPath
    required: false
    description: |
      The mount path of the Kubernetes auth method in Vault, if not mounted at the default "kubernetes" path.
    example: "kubernetes"
    default: "kubernetes"
    type: string
  - name: vaultServiceAccountTokenPath
    required: false
    description: |
      Path to the Kubernetes service account token used to authenticate, overriding the default projected service account token path.
    example: "/var/run/secrets/kubernetes.io/serviceaccount/token"
    default: "/var/run/secrets/kubernetes.io/serviceaccount/token"
    type: string
  - name: vaultKVPrefix
    required: false
    description: |
      The prefix in vault.
    example: "myprefix"
    default: "dapr"
    type: string
  - name: vaultKVUsePrefix
    required: false
    description: If false, vaultKVPrefix is forced to be empty. If the value is not given or set to true, vaultKVPrefix is used when accessing the vault. Setting it to false is needed to be able to use the BulkGetSecret method of the store.
    example: "true"
    type: bool
  - name: enginePath
    required: false
    description: |
      The engine path in vault.
    example: "kv"
    type: string
    default: "secret"
  - name: vaultValueType
    required: false
    description: |
      Vault value type. map means to parse the value into map[string]string, text means to use the value as a string. "map" sets the multipleKeyValuesPerSecret behavior. text makes Vault behave as a secret store with name/value semantics.
    example: "map"
    default: "map"
    type: string
