# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: conversation
name: googleai
version: v1
status: alpha
title: "GoogleAI"
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-conversation/googleai/
authenticationProfiles:
  - title: "API Key"
    description: "Authenticate using an API key"
    metadata:
      - name: key
        type: string
        required: true
        sensitive: true
        description: |
          API key for GoogleAI.
        example:  "**********"
        default: ""
  - title: "Google Cloud workload identity federation (SPIFFE)"
    description: |
      Authenticate without an API key. The Dapr runtime mints a JWT SVID for the app's SPIFFE ID,
      which Google Cloud's Security Token Service exchanges for a short-lived access token. Requires
      mTLS and Sentry JWT issuing, with Sentry registered as an OIDC provider in a workload identity
      pool. Use with an endpoint that accepts Google access tokens, such as the Vertex AI
      OpenAI-compatible endpoint.
    metadata:
      - name: workloadIdentityProvider
        type: string
        required: true
        description: |
          Full resource name of the workload identity pool provider. Also used as the audience of
          the JWT SVID.
        example: '"//iam.googleapis.com/projects/123456789/locations/global/workloadIdentityPools/dapr/providers/sentry"'
      - name: serviceAccountEmail
        type: string
        required: false
        description: |
          Email of the service account to impersonate. If not set, the federated token is used directly.
        example: '"dapr-ai@my-project.iam.gserviceaccount.com"'
metadata:
  - name: model
    required: false
    description: |
      The GoogleAI LLM to use. Configurable via GOOGLEAI_MODEL environment variable.
    type: string
    example: 'gemini-2.5-flash-lite'
    default: 'gemini-2.5-flash-lite'
  - name: endpoint
    required: false
    description: |
      OpenAI-compatible endpoint URL. If not specified, the Gemini API OpenAI-compatible endpoint is used.
    type: string
    example: 'https://us-central1-aiplatform.googleapis.com/v1/projects/my-project/locations/us-central1/endpoints/openapi'
    default: 'https://generativelanguage.googleapis.com/v1beta/openai/'
  - name: cacheTTL
    required: false
    description: |
      A time-to-live value for a prompt cache to expire. Uses Golang durations
    type: string
    example: '10m'
  - name: maxTokens
    required: false
    description: |
      Default maximum number of tokens the model may generate per request.
      A request-level maxTokens value greater than zero overrides this default.
      When unset, no cap is sent and the provider's own default applies.
    type: number
    example: "2048"
    default: ''
