# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: pubsub
name: azure.eventhubs
version: v1
status: stable
title: "Azure Event Hubs"
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-pubsub/setup-azure-eventhubs/
authenticationProfiles:
  - title: "Connection string"
    description: "Authenticate using a connection string."
    metadata:
      - name: connectionString
        required: true
        sensitive: true
        description: |
          Connection string for the Event Hub or the Event Hub namespace.
        example: |
          "Endpoint=sb://{EventHubNamespace}.servicebus.windows.net/;SharedAccessKeyName={PolicyName};SharedAccessKey={Key};EntityPath={EventHub}"
builtinAuthenticationProfiles:
  - name: "azuread"
    metadata:
      - name: eventHubNamespace
        type: string
        required: true
        description: |
          The Event Hub Namespace name.
        example: '"namespace"'
      - name: enableEntityManagement
        type: bool
        required: false
        default: "false"
        example: "false"
        description: |
          Allow management of the Event Hub namespace and storage account.
      # The following four properties are needed only if enableEntityManagement is set to true
      - name: resourceGroupName
        type: string
        required: false
        description: |
          Name of the resource group the Event Hub namespace is part of.
          Required when entity management is enabled.
        example: '"test-rg"'
      - name: subscriptionId
        type: string
        required: false
        description: |
          Azure subscription ID value. Required when entity management is enabled
        example: '"00112233-4455-6677-8899-aabbccddeeff"'
      - name: messageRetentionInDays
        type: number
        required: false
        default: "1"
        example: "90"
        description: |
          Number of days to retain messages for in the newly created Event
          Hub namespace. Used only when entity management is enabled.
      - name: partitionCount
        type: number
        required: false
        default: "1"
        example: "3"
        description: |
          Number of partitions for the new Event Hub namespace. Used only when
          entity management is enabled.
metadata:
  - name: enableInOrderMessageDelivery
    type: bool
    required: false
    default: "false"
    example: "true"
    description: |
      Enable in order processing of messages within a partition. Checkpoints advance
      only through contiguous successfully processed batches in both modes. When false,
      handler calls run concurrently up to `maxConcurrentHandlers`.
  - name: maxConcurrentHandlers
    type: number
    required: false
    default: "100"
    example: "10"
    description: |
      Maximum number of batches per partition that can be received but are not yet
      included in the in-memory contiguous-success prefix. This limits concurrent
      handler calls and pauses receives at capacity. The persisted checkpoint can lag
      behind this prefix according to `checkPointFrequencyPerPartition`, so restart
      replay may include additional successful batches. Applies when
      `enableInOrderMessageDelivery` is false and must be greater than 0.
  - name: storageAccountKey
    type: string
    required: false
    description: |
      Storage account key for the checkpoint store account. When using Azure AD,
      it is possible to omit this if the service principal has access to the
      storage account too.
      Property "storageAccountKey" is ignored when "storageConnectionString" is present
    example: '"112233445566778899"'
  - name: storageConnectionString
    type: string
    required: false
    description: |
      Connection string for the checkpoint store, alternative to specifying
      storageAccountKey.
      Property "storageAccountKey" is ignored when "storageConnectionString" is present
    example: |
      "BlobEndpoint=https://storagesample.blob.core.windows.net;..."
  - name: storageAccountName
    type: string
    required: true
    description: |
      Storage account name to use for the checkpoint store.
    example: '"myeventhubstorage"'
  - name: storageContainerName
    type: string
    required: true
    description: |
      Storage container name.
    example: '"myeventhubstoragecontainer"'
  - name: consumerID
    type: string
    required: true # consumerGroup is an alias for this field, let's promote this to default
    description: |
      The name of the Event Hubs Consumer Group to listen on.
    example: '"group1"'
  - name: checkPointFrequencyPerPartition
    type: number
    required: false
    default: "1"
    description: |
      Subscription metadata only. Set this value on the subscription, not in the
      component spec. Update the checkpoint for a partition starting with the first
      batch, then every N contiguous successfully processed batches. Set to 0 to stop
      writing checkpoints. This does not delete an existing checkpoint. If no
      checkpoint exists, consumption starts from the earliest retained event.
    example: "1"
  - name: getAllMessageProperties
    required: false
    default: "false"
    example: "false"
    binding:
      input: true
      output: false
    description: |
      When set to true, will retrieve all message properties and include them in the returned event metadata
