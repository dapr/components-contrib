# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: pubsub
name: solace.amqp
version: v1
status: beta
title: "Solace-AMQP"
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-pubsub/setup-solace-amqp/
capabilities:
  - ttl
authenticationProfiles:
  - title: "Solace authentication"
    description: "Authenticate using Solace credentials"
    metadata:
      - name: username
        required: true
        sensitive: false
        description: "The username to connect to the broker"
        example: '"default"'
        type: string
      - name: password
        required: true
        sensitive: true
        description: "The password to connect to the broker"
        example: '"default"'  
        type: string
  - title: "No authentication"
    description: "Connect to the broker without credential validation"
    metadata:
      - name: anonymous
        required: true
        description: |
          Connect to the broker without credential validation; only works if enabled on the broker.
        example: '"true"'
        type: bool
metadata:
  - name: url
    required: true
    description: |
      Address of the AMQP broker.
      Use the `amqp://`` URI scheme for non-TLS communication, and the `amqps://` URI scheme for TLS communication.
    example: '"amqp://host.domain[:port]"'
    sensitive: true
    type: string   
  - name: caCert
    required: false
    description: |
      Certificate Authority (CA) certificate in PEM format for verifying server TLS certificates.
    example: '"-----BEGIN CERTIFICATE-----\n<base64-encoded DER>\n-----END CERTIFICATE-----"'
    type: string
  - name: clientCert
    required: false
    description: |
      TLS client certificate in PEM format, for using TLS.
    example: '"-----BEGIN CERTIFICATE-----\n<base64-encoded DER>\n-----END CERTIFICATE-----"'
    type: string
  - name: clientKey
    required: false
    sensitive: true
    description: |
      TLS client key in PEM format, for using TLS.
    example: '"-----BEGIN PRIVATE KEY-----\n<base64-encoded PKCS8>\n-----END RSA PRIVATE KEY-----"'
    type: string
  - name: topicAddressPrefix
    required: false
    description: |
      Prefix prepended to the AMQP address of a topic, which is used for a bare topic name and for
      topics named `topic:<name>`.
      Defaults to the Solace addressing convention. Set it to the multicast prefix the broker is
      configured with, or to an empty value for brokers that address topics by name, such as
      Apache ActiveMQ Artemis.
    default: '"topic://"'
    example: '"topic://"'
    type: string
  - name: queueAddressPrefix
    required: false
    description: |
      Prefix prepended to the AMQP address of a queue, which is used for topics named `queue:<name>`.
      Defaults to the Solace addressing convention. Set it to the anycast prefix the broker is
      configured with, or to an empty value for brokers that address queues by name, such as
      Apache ActiveMQ Artemis. Note that when both prefixes are set to an empty value,
      `queue:<name>` addresses the same destination as `<name>`.
    default: '"queue://"'
    example: '"queue://"'
    type: string
