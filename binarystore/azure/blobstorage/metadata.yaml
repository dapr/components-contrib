# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: binarystore
name: azure.blobstorage
version: v1
status: alpha
title: "Azure Blob Storage"
description: "Store and retrieve large binary files using Azure Blob Storage."
urls:
  - title: Reference
    url: https://docs.dapr.io/reference/components-reference/supported-binarystore/azure-blobstorage/

authenticationProfiles:
  - title: "Connection string"
    description: "Authenticate using a connection string from the Azure portal."
    metadata:
      - name: connectionString
        required: true
        sensitive: true
        description: "The Azure Blob Storage connection string."
        example: '"DefaultEndpointsProtocol=https;AccountName=mystorageaccount;AccountKey=my-key;EndpointSuffix=core.windows.net"'

  - title: "Account key"
    description: "Authenticate using a storage account name and account key."
    metadata:
      - name: accountName
        required: true
        description: "The storage account name."
        example: '"mystorageaccount"'
      - name: accountKey
        required: true
        sensitive: true
        description: "The primary or secondary account key (base64-encoded)."
        example: '"my-base64-encoded-account-key"'

  - title: "Microsoft Entra ID"
    description: |
      Authenticate using Microsoft Entra ID (formerly Azure Active Directory).
      Supported credential types include workload identity, managed identity,
      client secret, and certificate.
    metadata:
      - name: accountName
        required: true
        description: "The storage account name."
        example: '"mystorageaccount"'

metadata:
  - name: containerName
    required: true
    description: "The name of the Azure Blob Storage container to use."
    example: '"my-binary-store-container"'

  - name: publicAccessLevel
    required: false
    description: "Indicates whether data in the container may be accessed publicly and the level of access."
    example: '"none"'
    default: "none"
    allowedValues:
      - "none"
      - "blob"
      - "container"

  - name: prefix
    required: false
    description: "An optional prefix prepended to all file names stored by this component."
    example: '"myprefix"'

  - name: endpoint
    type: string
    required: false
    description: |
      Optional custom endpoint URL, useful when using the Azurite emulator or
      custom domains for Azure Storage.
    example: '"http://127.0.0.1:10000"'

  - name: retryCount
    type: number
    default: "3"
    description: "Maximum number of HTTP retries for transient failures."
    example: '"5"'

  - name: disableEntityManagement
    type: bool
    default: "false"
    description: |
      When true, the component will not attempt to create the container during
      initialisation. Use this when the container is pre-provisioned and the
      identity used by Dapr has read/write permissions but not create permissions.
    example: '"true"'
