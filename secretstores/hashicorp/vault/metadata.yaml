# yaml-language-server: $schema=../../../component-metadata-schema.json
schemaVersion: v1
type: secretstores
name: hashicorp.vault
version: v1
status: stable
title: "Hashicorp Vault"
urls:
  - title: Reference
    url: "https://docs.dapr.io/reference/components-reference/supported-secret-stores/hashicorp-vault/"
authenticationProfiles:
  - title: "Token"
    description: "Authenticate using a static Vault token."
    metadata:
      - name: vaultAuthMethod
        type: string
        required: false
        description: |
          Authentication method.
          Defaults to "token" for this authentication profile.
        example: "token"
        default: "token"
        allowedValues:
          - "token"
      - name: vaultToken
        type: string
        required: true
        sensitive: true
        description: Token for authentication within Vault.
        example: "tokenValue"
  - title: "Token file"
    description: "Authenticate using a Vault token read from a file."
    metadata:
      - name: vaultAuthMethod
        type: string
        required: false
        description: |
          Authentication method.
          Defaults to "token" for this authentication profile.
        example: "token"
        default: "token"
        allowedValues:
          - "token"
      - name: vaultTokenMountPath
        type: string
        required: true
        description: Path to file containing token.
        example: "path/to/file"
  - title: "Kubernetes"
    description: "Authenticate using the Vault Kubernetes auth method and the pod's service account token."
    metadata:
      - name: vaultAuthMethod
        type: string
        required: true
        description: |
          Authentication method.
          This must be set to "kubernetes" for this authentication profile.
        example: "kubernetes"
        allowedValues:
          - "kubernetes"
      - name: vaultKubernetesRole
        type: string
        required: true
        description: The Vault role to authenticate as.
        example: "my-app-role"
      - name: vaultKubernetesMountPath
        type: string
        required: false
        description: The mount path of the Kubernetes auth method in Vault.
        example: "kubernetes"
        default: "kubernetes"
      - name: vaultServiceAccountTokenPath
        type: string
        required: false
        description: Path to the Kubernetes service account token.
        example: "/var/run/secrets/kubernetes.io/serviceaccount/token"
        default: "/var/run/secrets/kubernetes.io/serviceaccount/token"
metadata:
  - name: vaultAddr
    required: false
    description: |
      The address of the Vault server.
    example: "https://127.0.0.1:8200"
    type: string
    default: "https://127.0.0.1:8200"
  - name: caPem
    required: false
    description: |
      The inlined contents of the CA certificate to use, in PEM format. If defined, takes precedence over "caPath" and "caCert".
    example: |
      "-----BEGIN PUBLIC KEY-----\n...Base64 encoding of the DER encoded certificate...\n-----END PUBLIC KEY-----"
    type: string
  - name: caPath
    required: false
    description: The path to a folder holding the CA certificate file to use, in PEM format. If the folder contains multiple files, only the first file found will be used. If defined, takes precedence over caCert.
    example: "path/to/cacert/holding/folder"
    type: string
  - name: caCert
    required: false
    description: The path to the CA certificate to use, in PEM format.
    example: "path/to/cacert.pem"
    type: string
  - name: skipVerify
    required: false
    description: Skip TLS verification.
    example: "true"
    default: "false"
    type: string
  - name: tlsServerName
    required: false
    description: The name of the server requested during TLS handshake in order to support virtual hosting. This value is also used to verify the TLS certificate presented by Vault server.
    example: "tls-server"
    type: string
  - name: vaultKVPrefix
    required: false
    description: |
      The prefix in vault.
    example: "myprefix"
    default: "dapr"
    type: string
  - name: vaultKVUsePrefix
    required: false
    description: If false, vaultKVPrefix is forced to be empty. If the value is not given or set to true, vaultKVPrefix is used when accessing the vault. Setting it to false is needed to be able to use the BulkGetSecret method of the store.
    example: "true"
    type: bool
  - name: enginePath
    required: false
    description: |
      The engine path in vault.
    example: "kv"
    type: string
    default: "secret"
  - name: vaultValueType
    required: false
    description: |
      Vault value type. map means to parse the value into map[string]string, text means to use the value as a string. "map" sets the multipleKeyValuesPerSecret behavior. text makes Vault behave as a secret store with name/value semantics.
    example: "map"
    default: "map"
    type: string
