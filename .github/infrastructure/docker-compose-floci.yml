    AWS_EC2_METADATA_DISABLED: "true"
    AWS_CONFIG_FILE: /dev/null
    AWS_SHARED_CREDENTIALS_FILE: /dev/null
  tmpfs:
    - /app/data
  configs:
    - source: floci-test-fixtures
      target: /etc/floci/init/ready.d/10-test-fixtures.py
  healthcheck:
    test:
      - CMD
      - python3
      - -c
      - |
        import json
        import os
        import sys
        import urllib.request

        opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
        with opener.open("http://127.0.0.1:4566/_floci/init", timeout=2) as response:
            status = json.load(response)
        successful = any(
            script["script"] == "/etc/floci/init/ready.d/10-test-fixtures.py"
            and script["state"] == "successful" and script["return_code"] == 0
            for script in status["scripts"]["ready"]
        )
        with opener.open("http://127.0.0.1:4566/health", timeout=2) as response:
            services = json.load(response)["services"]
        expected = set(os.environ["FLOCI_TEST_EXPECTED_SERVICES"].split())
        running = {name for name, state in services.items() if state == "running"}
        if not expected or running != expected:
            raise RuntimeError(f"Expected running services {sorted(expected)}, got {sorted(running)}")
        sys.exit(0 if status["completed"]["ready"] is True and successful else 1)
    interval: 2s
    timeout: 5s
    retries: 10
    start_period: 60s
  stop_grace_period: 10s

services:
  floci-bindings-s3:
    <<: *floci-container
    profiles: ["bindings-s3"]
    environment:
      <<: *floci-environment
      FLOCI_TEST_PROFILE: bindings-s3
      FLOCI_TEST_EXPECTED_SERVICES: s3
      FLOCI_SERVICES_S3_ENABLED: "true"
  floci-state-dynamodb:
    <<: *floci-container
    profiles: ["state-dynamodb"]
    environment:
      <<: *floci-environment
      FLOCI_TEST_PROFILE: state-dynamodb
      FLOCI_TEST_EXPECTED_SERVICES: dynamodb
      FLOCI_SERVICES_DYNAMODB_ENABLED: "true"
  floci-state-dynamodb-certification:
    <<: *floci-container
    profiles: ["state-dynamodb-certification"]
    environment:
      <<: *floci-environment
      FLOCI_TEST_PROFILE: state-dynamodb-certification
      FLOCI_TEST_EXPECTED_SERVICES: dynamodb
      FLOCI_SERVICES_DYNAMODB_ENABLED: "true"
  floci-pubsub-snssqs:
    <<: *floci-container
    profiles: ["pubsub-snssqs"]
    environment:
      <<: *floci-environment
      FLOCI_TEST_PROFILE: pubsub-snssqs
      # IAM also controls STS/signin.
      FLOCI_TEST_EXPECTED_SERVICES: iam sns sqs
      FLOCI_SERVICES_IAM_ENABLED: "true"
      FLOCI_SERVICES_SNS_ENABLED: "true"
      FLOCI_SERVICES_SQS_ENABLED: "true"
  floci-pubsub-snssqs-certification:
    <<: *floci-container
    profiles: ["pubsub-snssqs-certification"]
    environment:
      <<: *floci-environment
      FLOCI_TEST_PROFILE: pubsub-snssqs-certification
      FLOCI_TEST_EXPECTED_SERVICES: iam sns sqs
      FLOCI_SERVICES_IAM_ENABLED: "true"
      FLOCI_SERVICES_SNS_ENABLED: "true"
      FLOCI_SERVICES_SQS_ENABLED: "true"
  floci-secretstores-secretsmanager:
    <<: *floci-container
    profiles: ["secretstores-secretsmanager"]
    environment:
      <<: *floci-environment
      FLOCI_TEST_PROFILE: secretstores-secretsmanager
      FLOCI_TEST_EXPECTED_SERVICES: secretsmanager
      FLOCI_SERVICES_SECRETSMANAGER_ENABLED: "true"

configs:
  floci-test-fixtures:
    content: |
      import json
      import os
      from functools import partial
      from urllib.parse import urlsplit

      import boto3
      from botocore.config import Config

      endpoint = "http://127.0.0.1:4566"
      session = boto3.Session(
          aws_access_key_id="test", aws_secret_access_key="test",
          aws_session_token="", region_name="us-east-1",
      )
      config = Config(
          connect_timeout=2, read_timeout=5, retries={"max_attempts": 0},
          proxies={}, endpoint_discovery_enabled=False,
          use_fips_endpoint=False, use_dualstack_endpoint=False,
          s3={"addressing_style": "path"},
      )
      waiter = {"Delay": 1, "MaxAttempts": 30}

      def client(service):
          return session.client(service, endpoint_url=endpoint, config=config)

      def seed_bucket():
          s3 = client("s3")
          s3.create_bucket(Bucket="floci-bindings-s3")
          s3.get_waiter("bucket_exists").wait(Bucket="floci-bindings-s3", WaiterConfig=waiter)

      def seed_table(name, key="key", ttl=False):
          dynamodb = client("dynamodb")
          dynamodb.create_table(
              TableName=name, BillingMode="PAY_PER_REQUEST",
              AttributeDefinitions=[{"AttributeName": key, "AttributeType": "S"}],
              KeySchema=[{"AttributeName": key, "KeyType": "HASH"}],
          )
          dynamodb.get_waiter("table_exists").wait(TableName=name, WaiterConfig=waiter)
          if ttl:
              dynamodb.update_time_to_live(
                  TableName=name,
                  TimeToLiveSpecification={"AttributeName": "expiresAt", "Enabled": True},
              )

      def seed_state_tables(certification=False):
          seed_table("floci-state-dynamodb", ttl=True)
          if certification:
              seed_table("floci-state-dynamodb-pkey", key="pkey")

      def seed_secrets():
          secrets = client("secretsmanager")
          for name, value in [("conftestsecret", "abcd"), ("secondsecret", "efgh")]:
              secrets.create_secret(Name=name, SecretString=value)

      def topic(name):
          return client("sns").create_topic(
              Name=name, Tags=[{"Key": "dapr-topic-name", "Value": name}],
          )["TopicArn"]

      def queue(name):
          sqs = client("sqs")
          result = sqs.create_queue(QueueName=name, tags={"dapr-queue-name": name})
          # Use container-local queue URLs.
          url = endpoint + urlsplit(result["QueueUrl"]).path
          arn = sqs.get_queue_attributes(
              QueueUrl=url, AttributeNames=["QueueArn"],
          )["Attributes"]["QueueArn"]
          return url, arn

      def seed_pubsub(pairs):
          sns, sqs = client("sns"), client("sqs")
          for queue_name, topic_names in pairs:
              topics = [topic(name) for name in topic_names]
              url, arn = queue(queue_name)
              policy = {
                  "Version": "2012-10-17",
                  "Statement": [{
                      "Effect": "Allow", "Principal": {"Service": "sns.amazonaws.com"},
                      "Action": "sqs:SendMessage", "Resource": arn,
                      "Condition": {"ArnEquals": {"aws:SourceArn": topic_arn}},
                  } for topic_arn in topics],
              }
              sqs.set_queue_attributes(QueueUrl=url, Attributes={"Policy": json.dumps(policy)})
              for topic_arn in topics:
                  sns.subscribe(
                      TopicArn=topic_arn, Protocol="sqs", Endpoint=arn,
                      ReturnSubscriptionArn=True, Attributes={"RawMessageDelivery": "false"},
                  )

      seeders = {
          "bindings-s3": seed_bucket,
          "state-dynamodb": seed_state_tables,
          "state-dynamodb-certification": partial(seed_state_tables, certification=True),
          "pubsub-snssqs": partial(seed_pubsub, [
              ("floci-conformance", [
                  "floci-conformance-topic", "floci-conformance-multi-1",
                  "floci-conformance-multi-2",
              ]),
          ]),
          # Leave test-managed resources unseeded.
          "pubsub-snssqs-certification": partial(seed_pubsub, [
              ("floci-cert-q3", ["floci-cert-t3"]),
              ("floci-cert-q-mvt", ["floci-cert-t-mvt"]),
          ]),
          "secretstores-secretsmanager": seed_secrets,
      }
      profile = os.environ.get("FLOCI_TEST_PROFILE", "")
      if profile not in seeders:
          raise ValueError(f"Unknown or unset FLOCI_TEST_PROFILE: {profile!r}")
      seeders[profile]()
